name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  editor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check repository sources
        run: python3 tools/check_repository.py
      - name: Install Godot 4.6.2
        run: |
          curl --fail --location --output "$RUNNER_TEMP/godot.zip" 'https://github.com/godotengine/godot-builds/releases/download/4.6.2-stable/Godot_v4.6.2-stable_linux.x86_64.zip'
          echo '30e6b6d141f0cd5bebd629ad1d0ef1324e60091bb20662d026b402ba58c59937  '"$RUNNER_TEMP/godot.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.6.2-stable_linux.x86_64"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
      - name: Import editor
        run: Godot_v4.6.2-stable_linux.x86_64 --headless --path . --import
      - name: Parse focused tests
        run: |
          for script in tests/*.gd; do
            Godot_v4.6.2-stable_linux.x86_64 --headless --path . --check-only --script "res://$script"
          done
      - name: Run headless regressions
        run: |
          for script in terrain_heightfield_check test_grid_sizing texture_image_adjustment_check prop_contact_regression_check; do
            Godot_v4.6.2-stable_linux.x86_64 --headless --path . --script "res://tests/$script.gd"
          done
